name: Deploy Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Expo EAS
        run: npm i -g eas-cli
      - name: Build Android APK
        run: eas build -p android --profile preview --outdir ./dist
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cityfix-android-apk
          path: ./apps/mobile/dist/android/apk/*.apk

  ios:
    name: iOS Build Configuration
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Configure Expo EAS
        run: npm i -g eas-cli
      - name: Build iOS preview
        run: eas build -p ios --profile preview --outdir ./dist
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: cityfix-ios-build
          path: ./apps/mobile/dist/ios/*.ipa
version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cityfix
      POSTGRES_PASSWORD: cityfix
      POSTGRES_DB: cityfix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: